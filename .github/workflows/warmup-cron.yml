name: Trigger warmup

on:
  schedule:
    # Every ~5 hours. Deliberately NOT on the hour: GitHub's shared scheduler is
    # most congested at :00, which was delaying these runs by hours.
    - cron: "23 6,11,16,21 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/warmup
        run: |
          base="${{ secrets.WARMUP_URL }}"
          base="${base%/}"   # strip any trailing slash

          # --location-trusted: Vercel's canonical-host 308s change the host, and
          # plain -L would drop the Authorization header across that hop.
          status=$(curl -sS -L --location-trusted \
            -o /tmp/response.txt \
            -w "%{http_code} %{url_effective}" \
            -X GET "$base/api/warmup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "final: $status"
          cat /tmp/response.txt

          code=${status%% *}
          if [ "$code" -ge 300 ]; then
            echo "Request failed with status $code"
            exit 1
          fi
